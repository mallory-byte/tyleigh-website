<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Store — Wallace Family Farms</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='84'%3E%F0%9F%90%84%3C/text%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

<body class="has-hero">
  <section class="page-hero">
    <div class="ph" data-img="wool"></div>
    <div class="scrim"></div>
    <div class="ph-inner wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / Store</div>
      <h1 data-copy="storeHeading"></h1>
    </div>
  </section>

  <section class="section">
    <div class="wrap">
      <div style="max-width:640px">
        <span class="kicker" data-copy="storeKicker"></span>
        <h2 class="big" style="margin:1rem 0 1rem" data-copy="storeIntroHeading"></h2>
        <p class="lede" data-copy="storeIntro"></p>
      </div>

      <div class="store-grid" id="storeGrid" style="margin-top:3rem"></div>

      <div class="credo" style="margin-top:4rem">
        <div class="wrap section" style="padding:clamp(2rem,4vw,3rem) 0">
          <h2 class="big" style="color:var(--bone);max-width:24ch" data-copy="storeCta"></h2>
          <a class="btn" style="margin-top:1.6rem" href="inquire.html?about=Store">Send an inquiry</a>

  <script src="assets/data.js"></script>
